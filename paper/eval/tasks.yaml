    - {tool: assess_buildability, path: job.target_height_mm, op: approx, value: 500, tol: 0.5}
    - {tool: assess_buildability, path: job.layer_height_mm, op: approx, value: 10, tol: 0.1}
    - {tool: assess_buildability, path: job.layer_cycle_time_s, op: approx, value: 20, tol: 0.1}
    - {tool: assess_buildability, path: material.tau_s0_Pa, op: approx, value: 1200, tol: 1}
    - {tool: assess_buildability, path: material.athix_Pa_s, op: approx, value: 0.5, tol: 0.01}
    - {tool: assess_buildability, path: material.rho_kg_m3, op: approx, value: 2150, tol: 1}

