  expect_tools: [predict_properties]
  checks:
    - {tool: predict_properties, path: mix.w_b, op: approx, value: 0.349, tol: 0.006}
    - {tool: predict_properties, path: mix.s_b, op: approx, value: 2.0, tol: 0.03}
    - {tool: predict_properties, path: mix.binder, op: binder_frac, value: {portland_cement: 0.769, fly_ash_class_F: 0.231}, tol: 0.02}
    - {tool: predict_properties, path: mix.admixtures_pct.superplasticiser_pce, op: approx, value: 0.5, tol: 0.02}
    - {tool: predict_properties, path: targets, op: contains, value: compressive_strength}
    - {tool: predict_properties, path: targets, op: contains, value: drying_shrinkage}

- id: P06
