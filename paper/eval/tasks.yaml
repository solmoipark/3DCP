  showcase: true
  prompt: "Find 10 published mixes with 28-day compressive strength of at least 40 MPa and a static yield stress between 1 and 4 kPa; prefer 3DCP studies."
  expect_tools: [retrieve_literature]
  checks:
    - {tool: retrieve_literature, path: targets, op: target, value: {quantity: compressive_strength, kind: ge, lo: 40, canonical_unit: MPa}}
    - {tool: retrieve_literature, path: targets, op: target, value: {quantity: static_yield_stress, kind: range, lo: 1000, hi: 4000, canonical_unit: Pa}}
    - {tool: retrieve_literature, path: prefer_3dcp, op: eq, value: true}
    - {tool: retrieve_literature, path: n, op: approx, value: 10, tol: 0.5}

