    - {tool: predict_properties, path: targets, op: contains, value: flexural_strength}
    - {tool: predict_properties, path: targets, op: contains, value: porosity_total}

- id: P07
  group: curves
  showcase: true
  prompt: "For a 3DCP mortar with w/b 0.35, s/b 1.5, 90 % OPC + 10 % silica fume and 0.6 % PCE, plot the Bingham flow curve up to 100 1/s and the structuration curve over 45 minutes of rest, and compare both with measured literature curves."
  expect_tools: [flow_curve, structuration_curve]
  checks:
    - {tool: flow_curve, path: mix.w_b, op: approx, value: 0.35, tol: 0.005}
    - {tool: flow_curve, path: max_rate_1s, op: approx, value: 100, tol: 0.5}
    - {tool: structuration_curve, path: max_rest_min, op: approx, value: 45, tol: 0.5}
    - {tool: structuration_curve, path: mix.binder, op: binder_frac, value: {portland_cement: 0.9, silica_fume: 0.1}, tol: 0.02}

- id: P08
  group: predict
  turns:
    - "Predict the 28-day compressive strength of an OPC mortar, w/b 0.45, s/b 2.5, no admixtures."
    - "And if I lower w/b to 0.30 and add 0.8 % PCE, keeping everything else the same?"
  expect_tools: [predict_properties]
  checks_turn: 2
  checks:
    - {tool: predict_properties, path: mix.w_b, op: approx, value: 0.30, tol: 0.005}
    - {tool: predict_properties, path: mix.s_b, op: approx, value: 2.5, tol: 0.05}
    - {tool: predict_properties, path: mix.admixtures_pct.superplasticiser_pce, op: approx, value: 0.8, tol: 0.01}

- id: L01
