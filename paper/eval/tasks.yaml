  showcase: true
  slow: true
  prompt: "Design a mix for this print job: 600 mm high, 1.5 m long wall, two filaments, 25 mm nozzle, 50 mm/s, open time 60 min. Space: OPC required 0.5-1.0, silica fume 0-0.15, limestone powder 0-0.3, w/b 0.28-0.42, s/b 0.8-1.8, PCE 0.1-1.2 %, cellulose VMA 0-0.4 %. The mix must also reach 30 MPa at 28 days. Run without asking."
