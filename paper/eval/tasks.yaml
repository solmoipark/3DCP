- id: B01
  group: buildability
  showcase: true
  prompt: "I want to print a 600 mm high, 1.5 m long wall with two filaments across the thickness, 25 mm nozzle, 50 mm/s, open time 60 min. The material has a static yield stress of 3 kPa and Athix of 1 Pa/s. Is it printable, and what is the layer cycle-time window?"
  expect_tools: [assess_buildability]
  checks:
    - {tool: assess_buildability, path: job.target_height_mm, op: approx, value: 600, tol: 0.5}
    - {tool: assess_buildability, path: job.footprint_mm, op: approx, value: 1500, tol: 0.5}
    - {tool: assess_buildability, path: job.wall_filaments, op: approx, value: 2, tol: 0.1}
    - {tool: assess_buildability, path: job.nozzle_d_mm, op: approx, value: 25, tol: 0.1}
    - {tool: assess_buildability, path: job.print_speed_mm_s, op: approx, value: 50, tol: 0.1}
    - {tool: assess_buildability, path: job.open_time_min, op: approx, value: 60, tol: 0.1}
    - {tool: assess_buildability, path: material.tau_s0_Pa, op: approx, value: 3000, tol: 1}
    - {tool: assess_buildability, path: material.athix_Pa_s, op: approx, value: 1.0, tol: 0.01}

