# Benchmark tasks for the 3DCP agent paper. Every task is run in a fresh session (PMPREDICT_LANG=en) on each backend.
# checks are evaluated against the tool calls recorded in the turn (a check passes if ANY call of that tool satisfies it).
# ops: approx (number, tol absolute) | eq | contains (list contains value) | exists | binder_frac (normalised binder dict, tol)
#      target (targets list has an entry with quantity/kind and canonical bound, unit-converted)
# unit conversion for `target`: canonical given as {quantity, kind, lo|hi|goal, canonical_unit}
# numeric fidelity, latency and tokens are scored for every task automatically.

- id: P01
  group: predict
  showcase: true
  prompt: "Predict the 28-day compressive strength and flow table spread of an OPC mortar with w/b 0.40, s/b 2.0 and 0.5 % PCE superplasticiser. Briefly."
  expect_tools: [predict_properties]
  checks:
    - {tool: predict_properties, path: mix.w_b, op: approx, value: 0.40, tol: 0.005}
    - {tool: predict_properties, path: mix.s_b, op: approx, value: 2.0, tol: 0.05}
    - {tool: predict_properties, path: mix.binder, op: binder_frac, value: {portland_cement: 1.0}, tol: 0.02}
    - {tool: predict_properties, path: mix.admixtures_pct.superplasticiser_pce, op: approx, value: 0.5, tol: 0.01}
    - {tool: predict_properties, path: targets, op: contains, value: compressive_strength}
    - {tool: predict_properties, path: targets, op: contains, value: flow_table_spread}
  answer_mentions_any: [cube, comp_cube50, default]

- id: P02
  group: predict
  prompt: "For a 3D-printable mortar with w/b 0.32, s/b 1.2, binder 70 % OPC + 20 % class F fly ash + 10 % silica fume, 0.8 % PCE and 0.2 % cellulose VMA, predict the static yield stress and plastic viscosity."
  expect_tools: [predict_properties]
  checks:
    - {tool: predict_properties, path: mix.w_b, op: approx, value: 0.32, tol: 0.005}
    - {tool: predict_properties, path: mix.s_b, op: approx, value: 1.2, tol: 0.05}
    - {tool: predict_properties, path: mix.binder, op: binder_frac, value: {portland_cement: 0.70, fly_ash_class_F: 0.20, silica_fume: 0.10}, tol: 0.02}
    - {tool: predict_properties, path: mix.admixtures_pct.superplasticiser_pce, op: approx, value: 0.8, tol: 0.01}
    - {tool: predict_properties, path: mix.admixtures_pct.vma_cellulose, op: approx, value: 0.2, tol: 0.01}
    - {tool: predict_properties, path: mix.conditions.is_3dcp, op: eq, value: true}
    - {tool: predict_properties, path: targets, op: contains, value: static_yield_stress}
    - {tool: predict_properties, path: targets, op: contains, value: plastic_viscosity}

- id: P03
  group: predict
  prompt: "What 7-day compressive strength would you expect for a plain OPC paste with w/c 0.45, tested on 40 mm prisms (EN 196)?"
  expect_tools: [predict_properties]
  checks:
    - {tool: predict_properties, path: mix.system_type, op: eq, value: paste}
    - {tool: predict_properties, path: mix.w_b, op: approx, value: 0.45, tol: 0.005}
    - {tool: predict_properties, path: mix.conditions.age_d, op: approx, value: 7, tol: 0.01}
    - {tool: predict_properties, path: mix.conditions.comparability_group, op: eq, value: comp_prism40}
    - {tool: predict_properties, path: targets, op: contains, value: compressive_strength}

- id: P04
