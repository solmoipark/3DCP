- id: D01
  group: design
  showcase: true
  slow: true
  prompt: "Inverse-design a printable mortar: 28-day compressive strength >= 40 MPa and static yield stress between 1 and 4 kPa, minimising the clinker fraction. Search space: OPC required 0.5-1.0, silica fume 0-0.15, limestone powder 0-0.3, w/b 0.28-0.45. Run without asking."
  expect_tools: [design_mix]
  checks:
    - {tool: design_mix, path: targets, op: target, value: {quantity: compressive_strength, kind: ge, lo: 40, canonical_unit: MPa}}
    - {tool: design_mix, path: targets, op: target, value: {quantity: static_yield_stress, kind: range, lo: 1000, hi: 4000, canonical_unit: Pa}}
    - {tool: design_mix, path: space.w_b, op: eq, value: [0.28, 0.45]}
    - {tool: design_mix, path: space.binder.portland_cement.required, op: eq, value: true}
    - {tool: design_mix, path: space.binder.silica_fume.hi, op: approx, value: 0.15, tol: 0.001}
    - {tool: design_mix, path: space.binder.limestone_powder.hi, op: approx, value: 0.3, tol: 0.001}
    - {tool: design_mix, path: objectives, op: contains, value: clinker_fraction}

