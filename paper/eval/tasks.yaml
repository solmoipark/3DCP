  prompt: "Mortar with 50 % GGBFS replacement, w/b 0.45, s/b 2.5, sealed curing. Give the 90-day compressive strength."
  expect_tools: [predict_properties]
  checks:
    - {tool: predict_properties, path: mix.binder, op: binder_frac, value: {portland_cement: 0.5, ggbfs: 0.5}, tol: 0.02}
    - {tool: predict_properties, path: mix.conditions.age_d, op: approx, value: 90, tol: 0.01}
    - {tool: predict_properties, path: mix.conditions.curing, op: eq, value: sealed}
    - {tool: predict_properties, path: targets, op: contains, value: compressive_strength}

- id: P05
